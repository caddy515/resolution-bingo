<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EFL Designs Legal & Support</title>
    <style>
      :root {
        --bg: #fffaf2;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #5a6478;
        --accent: #ea580c;
        --border: #eadfce;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff2d9 0%, transparent 32%),
          linear-gradient(180deg, #fff8ef 0%, #fffdf9 100%);
      }

      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 20px 72px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        padding: 7px 12px;
        border-radius: 999px;
        background: #fff1e8;
        color: var(--accent);
        font: 700 12px/1.2 Arial, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.02;
      }

      p,
      li,
      a {
        font: 16px/1.65 Arial, sans-serif;
      }

      p,
      li {
        color: var(--muted);
      }

      .links {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }

      .linkCard {
        display: block;
        text-decoration: none;
        color: inherit;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: #fffdf9;
        padding: 18px;
      }

      .linkCard strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font: 800 17px/1.3 Arial, sans-serif;
      }

      .linkCard span {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <div class="eyebrow">EFL Designs</div>
        <h1>Legal & Support</h1>
        <p>Public legal and support pages for Resolution Bingo and Shoe Tracker 10000.</p>

        <div class="links">
          <a class="linkCard" href="./privacy-policy.html">
            <strong>Privacy Policy</strong>
            <span>How account and card data are handled.</span>
          </a>
          <a class="linkCard" href="./terms-of-use.html">
            <strong>Terms of Use</strong>
            <span>Usage rules, disclaimers, and limitation of liability language.</span>
          </a>
          <a class="linkCard" href="./support.html">
            <strong>Support</strong>
            <span>Contact details and help information for users.</span>
          </a>
        </div>
      </section>
    </main>
  </body>
  </html>
